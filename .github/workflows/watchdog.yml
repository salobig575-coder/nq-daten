name: Datenfrische prüfen

on:
  workflow_dispatch: {}

  # Zwei Eintraege pro Stunde, weil GitHub geplante Laeufe unter Last
  # auslaesst (siehe fetch.yml). Versetzt zu den Abruf-Laeufen (:07/:37).
  schedule:
    - cron: "22 * * * *"
    - cron: "52 * * * *"

permissions:
  contents: write
  issues: write

jobs:
  frische-check:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Alter und Qualität der Daten prüfen
        id: check
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, datetime
          from zoneinfo import ZoneInfo

          # Ausserhalb der Apps-Script-Fenster kommt nur der Cron (2x pro Stunde,
          # real mit Verzoegerung). 30 Minuten waren deshalb zu knapp und
          # haben Fehlalarme (Issues #2-#4) erzeugt.
          STALE_MIN = 75

          def zeile(text):
              # Eine Zeile pro Ausgabe (GITHUB_OUTPUT), keine Zeilenumbrueche.
              return " ".join(str(text).split())

          # --- 1) Ist levels.json ueberhaupt frisch berechnet worden? ---
          try:
              with open("data/levels.json") as f:
                  data = json.load(f)
              berechnet = datetime.datetime.strptime(data["berechnet_utc"], "%Y-%m-%d %H:%M:%S")
              berechnet = berechnet.replace(tzinfo=datetime.timezone.utc)
              alter_min = (datetime.datetime.now(datetime.timezone.utc) - berechnet).total_seconds() / 60
              if alter_min > STALE_MIN:
                  print("stale=true")
                  et = berechnet.astimezone(ZoneInfo("America/New_York")).strftime("%Y-%m-%d %H:%M")
                  print(zeile(f"grund=levels.json ist {alter_min:.0f} Minuten alt (zuletzt berechnet {et} ET)"))
              else:
                  print("stale=false")
          except Exception as e:
              data = None
              print("stale=true")
              print(zeile(f"grund=levels.json konnte nicht gelesen werden: {e}"))

          # --- 2) Selbst wenn frisch berechnet: hat fetch_data.py fuer NQ/ES
          #        (und fuer XAU/BTC in levels_extra.json) trotzdem eine Serie
          #        NICHT aktualisieren koennen? Das faellt
          #        an berechnet_utc allein nie auf, weil analyse.py auch mit
          #        alten Bars "erfolgreich" durchlaeuft. ---
          qualitaet_probleme = []
          dateien = [("data/levels.json", ("nq", "es")), ("data/levels_extra.json", ("xau", "btc"))]
          for pfad, symbole in dateien:
              try:
                  with open(pfad) as f:
                      inhalt = json.load(f)
              except Exception as e:
                  qualitaet_probleme.append(f"{pfad} nicht lesbar: {e}")
                  continue
              for symbol in symbole:
                  eintrag = inhalt.get(symbol) or {}
                  if "fehler" in eintrag:
                      qualitaet_probleme.append(f"{symbol}: Auswertung fehlgeschlagen ({eintrag['fehler']})")
                      continue
                  # Nur echte Abruf-Ausfaelle zaehlen. "fehlende_kerzen" (einzelne
                  # Kerzen, die Yahoo nie liefert) ist ein Hinweis, kein Ausfall.
                  serien = (eintrag.get("fetch_warnung") or {}).get("fehlgeschlagene_serien") or []
                  if serien:
                      qualitaet_probleme.append(f"{symbol}: {', '.join(serien)}")
          if qualitaet_probleme:
              print("qualitaet=true")
              grund2 = "Datenabruf teilweise fehlgeschlagen, alte Bars in Benutzung -> " + " | ".join(qualitaet_probleme)
              print(zeile(f"qualitaet_grund={grund2}"))
          else:
              print("qualitaet=false")
          EOF

      - name: Issue öffnen bei Stillstand
        if: steps.check.outputs.stale == 'true'
        uses: actions/github-script@v7
        env:
          GRUND: ${{ steps.check.outputs.grund }}
        with:
          script: |
            // Text ueber eine Umgebungsvariable, nicht direkt ins Skript
            // eingesetzt - sonst koennte ein Backtick im Fehlertext es brechen.
            const grund = process.env.GRUND || "";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "datenausfall"
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "⚠️ nq-daten: Datenabruf steht still",
                body: grund, labels: ["datenausfall"]
              });
            }

      - name: Issue schließen wenn wieder frisch
        if: steps.check.outputs.stale == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "datenausfall"
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: "Daten sind wieder aktuell — Issue wird automatisch geschlossen."
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed"
              });
            }

      - name: Issue öffnen bei teilweisem Datenausfall
        if: steps.check.outputs.qualitaet == 'true'
        uses: actions/github-script@v7
        env:
          GRUND: ${{ steps.check.outputs.qualitaet_grund }}
        with:
          script: |
            const grund = process.env.GRUND || "";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "datenqualitaet"
            });
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: "⚠️ nq-daten: Kursreihen laufen mit veralteten Bars",
                body: grund, labels: ["datenqualitaet"]
              });
            }

      - name: Issue schließen wenn Datenqualität wieder ok
        if: steps.check.outputs.qualitaet == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "datenqualitaet"
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number,
                body: "Alle Kursreihen laufen wieder mit frischen Daten — Issue wird automatisch geschlossen."
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: issue.number, state: "closed"
              });
            }

      # Der Daily-Bias-Review laeuft in einer Session ohne GitHub-API-Zugriff
      # (nur anonymes git clone/fetch ist dort freigegeben). Damit er trotzdem
      # erfaehrt, ob die Datenkette steht, schreibt dieser Schritt das Ergebnis
      # JEDES Laufs zusaetzlich in eine Datei im Repo, die per git clone lesbar
      # ist - unabhaengig davon, ob gerade ein Issue offen ist oder nicht.
      - name: Status-Datei schreiben und committen
        if: always()
        env:
          STALE: ${{ steps.check.outputs.stale }}
          GRUND: ${{ steps.check.outputs.grund }}
          QUALITAET: ${{ steps.check.outputs.qualitaet }}
          QUALITAET_GRUND: ${{ steps.check.outputs.qualitaet_grund }}
        run: |
          python3 - <<'EOF'
          import json, datetime, os

          status = {
              "aktualisiert_utc": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
              "stale": os.environ.get("STALE") == "true",
              "stale_grund": os.environ.get("GRUND") or None,
              "qualitaet_problem": os.environ.get("QUALITAET") == "true",
              "qualitaet_grund": os.environ.get("QUALITAET_GRUND") or None,
          }
          with open("data/watchdog_status.json", "w") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
          EOF

          git config user.name "kursdaten-bot"
          git config user.email "actions@github.com"
          git add data/watchdog_status.json
          if git diff --staged --quiet; then
            echo "Keine Aenderung, nichts zu committen."
          else
            git commit -m "Watchdog-Status $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Kein gemeinsamer concurrency-Block mit fetch.yml: GitHub haelt pro
            # Gruppe nur EINEN wartenden Lauf, ein wartender Watchdog wuerde
            # sonst einen wartenden Datenabruf verdraengen. Stattdessen
            # rebase + Wiederholung, wie in fetch.yml.
            for versuch in 1 2 3 4; do
              git pull --rebase origin main && git push && exit 0
              echo "Push-Versuch $versuch fehlgeschlagen, neuer Versuch ..."
              sleep $((versuch * 5))
            done
            echo "::error::Push nach 4 Versuchen fehlgeschlagen"
            exit 1
          fi
