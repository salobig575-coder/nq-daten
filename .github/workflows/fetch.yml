name: Kursdaten holen

on:
  schedule:
    # 11:00-15:00 UTC deckt den Daily-Bias-Lauf um 14:45 Wien ab (Sommer+Winter).
    # 20:00-22:00 UTC deckt die Bias-Review um 22:30 Wien ab (Sommer+Winter).
    - cron: "3,23,43 11-15,20-22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: kursdaten
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten abrufen
        run: python fetch_data.py

      - name: Levels berechnen
        run: python analyse.py

      - name: Ergebnis committen
        run: |
          git config user.name "kursdaten-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Keine Aenderung, nichts zu committen."
          else
            git commit -m "Kursdaten $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
