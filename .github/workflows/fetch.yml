name: Kursdaten holen

on:
  # Primaerer Ausloeser bleibt das Google Apps Script ("NQ-daten-trigger"),
  # das die GitHub-API exakt zur Zielzeit aufruft. GitHub-eigene schedule-Crons
  # koennen laut GitHub-Doku bei hoher Last verzoegert werden - deshalb war der
  # Cron hier vorher komplett raus.
  workflow_dispatch: {}

  # Zusaetzliche, unabhaengige Spur: stuendlich, alle sieben Tage. Das Apps
  # Script feuert nur in seinen Fenstern (Wiener Zeit: Mo-Fr 13:00-16:30 und
  # 21:00-23:00, taeglich 05:30-07:30). Diese Spur haelt die Daten dazwischen,
  # am Wochenende (BTC) und nach dem Freitags-Schluss (Wochenanalyse) frisch.
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

concurrency:
  group: kursdaten
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daten abrufen
        run: python fetch_data.py

      - name: Levels berechnen
        run: python analyse.py

      # Rechnet jeden Wert aus levels.json unabhaengig aus den Roh-Bars nach
      # und schreibt das Ergebnis nach data/pruefung.json. Der Schritt darf
      # den Workflow NICHT abbrechen: pruefung.json soll auch dann mit
      # committet werden, wenn sie Fehler meldet - nur so sieht der Daily Bias
      # ueberhaupt, dass etwas nicht stimmt. Der Bias entscheidet dann anhand
      # der Datei, was er sagen darf und was nicht.
      - name: Levels gegenpruefen
        id: pruefung
        continue-on-error: true
        run: python pruefe.py

      - name: Ergebnis der Pruefung anzeigen
        if: always()
        run: |
          if [ "${{ steps.pruefung.outcome }}" = "failure" ]; then
            echo "::warning::Die Gegenpruefung hat Abweichungen gefunden. "\
              "Details in data/pruefung.json - betroffene Konzepte gehoeren "\
              "nicht ungeprueft in den Daily Bias."
          else
            echo "Gegenpruefung bestanden."
          fi

      - name: Ergebnis committen
        run: |
          git config user.name "kursdaten-bot"
          git config user.email "actions@github.com"
          # Die vollen CSVs unter data/ sind per .gitignore ausgeschlossen
          # (Repo-Groesse, R3). Committet werden die JSON-Ergebnisse und
          # data/aktuell/ (letzte drei Tage 5m je Symbol, auch XAU/BTC) fuer
          # das Bias-Review.
          git add data/
          if git diff --staged --quiet; then
            echo "Keine Aenderung, nichts zu committen."
          else
            git commit -m "Kursdaten $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
