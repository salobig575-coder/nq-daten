name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests -q
      # pruefe.py muss auf historischen Datenstaenden ohne Fehler durchlaufen
      - run: SNAPSHOT_DATA=tests/fixtures/data python tools/regress.py pruefen 2026-09-25T10:07 2026-09-28T15:07
